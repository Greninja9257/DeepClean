[package]
name = "deepclean"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
dialoguer = "0.12.0"
glob = "0.3.4"
humantime = "2.4.0"
indicatif = "0.18.6"
libc = "0.2.190"
plist = "1.10.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
